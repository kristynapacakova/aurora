<!-- ───────────────────────────────────────────────────────────────────────
     AURORA — sekce „Sleduj nás na Instagramu“ pro hlavní stránku Uscreenu
     Vloží se jako další blok Custom HTML, nejlépe dolů pod sekci „O mně“.

     Fotky se berou přímo z webu Aurory (www.aurorayoga.cz/ig-1.jpg až -5),
     takže se nikam nenahrávají a stačí je vyměnit na jednom místě — ve
     složce public/ v repozitáři webu. Statické obrázky jsou z brány /vstup
     vyloučené, takže jsou dostupné i před spuštěním webu.

     ZKONTROLUJ ADRESU INSTAGRAMU níž (je na dvou místech) — má být stejná
     jako v administraci Aurory → Nastavení → Kontakt.

     Šířka ani odsazení se neřeší vlastními hodnotami, používají se třídy
     Uscreenu (px-6 md:px-16, pt-8 md:pt-12, container mx-auto), aby sekce
     lícovala se zbytkem stránky a měla stejný rytmus mezer.

     Mřížka nemá media queries: `auto-fit` + `minmax` zalomí fotky samo
     podle šířky displeje — na mobilu budou dvě vedle sebe, na monitoru pět.
     ─────────────────────────────────────────────────────────────────── -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Poppins:wght@300;400&display=swap');

  .aurora-ig-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }

  .aurora-ig-grid a {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    display: block;
  }

  .aurora-ig-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .aurora-ig-grid a:hover img {
    transform: scale(1.05);
  }
</style>
