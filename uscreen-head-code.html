     AURORA — globální styly pro celé studio
     Vloží se do: Website → Advanced → Head Code

     Na rozdíl od bloků Custom HTML, které patří jedné stránce, tenhle kód
     se vloží do hlavičky KAŽDÉ stránky storefrontu — včetně katalogu,
     přihlášení a dalších systémových stránek, kam se bloky přidat nedají.

     ── CO SEM PATŘÍ A CO NE ──────────────────────────────────────────

     Sem patří jen to, co má platit všude. Úpravy kolem menu a úvodní fotky

     v bloku Custom HTML na hlavní stránce — tady by zprůhlednily hlavičku
     i nad bílým obsahem katalogu a přihlašování, kde pod ní žádná fotka
     není, a vypadalo by to rozbitě.

     Pozor na široké selektory jako `header` nebo `body`: zasáhly by
     i stránky, na které se člověk nedívá.
