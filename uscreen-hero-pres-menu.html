<!-- ───────────────────────────────────────────────────────────────────────
     AURORA — fotka v heru až pod menu (jako to má Yogitch)
     Vloží se jako blok Custom HTML na hlavní stránku studia.

     Blok nic nevykresluje, jen mění vzhled menu a úvodní sekce. V editoru
     bude vidět jako prázdný přerušovaný rámeček — to je správně, projeví
     se to až na živé stránce po „Save & apply“.

     Vrácení zpět: smazat tenhle blok.

     ── DVĚ PASTI, NA KTERÉ SE TU UŽ NARAZILO ──────────────────────────

     1) Třídu `pb-hero` nemá jen hero. Uscreen ji dává i dalším sekcím,
        takže plošné pravidlo na `.pb-hero` vytáhlo nahoru a překrylo
        závojem i sekci s fotkami, která tím z živé stránky úplně zmizela.
        Proto se míří na `div.sticky:has(> #website-header) + div[...]`,
        tedy na sekci hned za menu — na hero z definice pořadí. Kdyby se
        hero někdy přesunulo jinam než na první místo, pravidlo přestane
        platit, ale nic nerozbije.

     2) Na barvu textu v menu se nesahá. Obarvení položek na bílo kvůli
        čitelnosti nad fotkou opakovaně rozbíjelo rozbalovací panel účtu,
        kde bílý text na světlém pozadí mizel. Uscreen má hlavičku
        provázanou s barevným schématem, takže zásah zvenčí se dřív nebo
        později někde projeví. Místo toho se zesvětluje podklad pod menu.
     ─────────────────────────────────────────────────────────────────── -->

<style>
  /* 1) Lepivost sedí na obalu menu, ne na menu samotném — proto samotná
        hlavička na position nereagovala. Bez tohohle se menu při rolování
        plazí přes obsah pod fotkou. */
  div.sticky:has(> #website-header) {
    position: relative !important;
  }

  /* 2) Menu průhledné a bez spodní linky. */
  header#website-header {
    position: relative !important;
    background: transparent !important;
    border-bottom: 0 !important;
    z-index: 50;
  }

  /* 3) Fotku vytáhnout nahoru pod menu.
        -5rem je přesně výška menu (h-20). Horní odsazení pak vrací obsah
        zpátky dolů, aby nadpis nezalezl pod položky menu. */
  div.sticky:has(> #website-header) + div[data-editor="section"] .pb-hero {
    margin-top: -5rem;
    padding-top: 8rem;
  }

  /* 4) Obsah sekcí nenatahovat přes celý monitor. Uscreen má kontejner na
        plnou šířku s 3% odsazením, takže na širokém displeji se text roztáhne
        přes celou plochu. 1152 px je stejná šířka, jakou drží web Aurory
        (max-w-6xl), takže na sebe studio a web navazují.

        Fotku v heru to nezúží — ta leží mimo kontejner, je absolutně umístěná
        vůči sekci. Zúží se i lišta menu, takže logo se zarovná s obsahem pod
        sebou místo aby viselo na kraji obrazovky. */
  .container {
    max-width: 1152px !important;
  }

  /* 5) Krémový závoj pod položkami menu, aby na fotce zůstaly čitelné.
        Odstín je stejný jako scheme color v nastavení Brandingu (#FCF4F1).
        Leží nad fotkou, ale pod textem hera (ten má z-10).

        Je to skvrna uprostřed, ne pruh přes celou šířku: logo vlevo je samo
        světle broskvové a na krémovém podkladu bledlo. Do stran se závoj
        vytrácí, takže logo i tlačítko účtu mají pod sebou fotku, zatímco
        vycentrované položky menu podklad mají. */
  div.sticky:has(> #website-header) + div[data-editor="section"] .pb-hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 14rem;
    background: radial-gradient(
      ellipse 55% 11rem at 50% 0%,
      rgba(252, 244, 241, 0.94) 0%,
      rgba(252, 244, 241, 0) 100%
    );
    z-index: 5;
    pointer-events: none;
  }
</style>
