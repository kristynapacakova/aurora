<!-- ───────────────────────────────────────────────────────────────────────
     AURORA — proužek „Online členství“ pro hlavní stránku Uscreenu
     Vloží se jako blok Custom HTML na místo šablonové sekce s předplatným
     (tu pak smaž, ať tam nejsou obě).

     Odkaz vede na /join — to je u Uscreenu stránka s výběrem předplatného.
     Pozor, NE /plans ani /sign_up; obě vracejí chybovou stránku.

     ── PROČ VLASTNÍ BLOK A NE ŠABLONA ────────────────────────────────

     Šablonová sekce dává text doleva a tlačítko doprava a mezi nimi nechá
     všechno, co zbyde, a nedalo se to nastavit.

     Karta schválně nemá vlastní šířku a sedí UVNITŘ kontejneru Uscreenu
     (`container mx-auto`) — stejně jako sekce „O mně“ a Instagram. Hrany
     tím lícují se sousedními sekcemi při jakékoliv šířce obsahu.

     Pozor na to vnoření: třída karty nastavuje vlastní `padding`, a kdyby
     seděla přímo na kontejneru, přebila by jeho vnitřní odsazení. Karta by
     pak byla o 64 px na každou stranu širší než mřížka fotek nad ní.

     Tlačítko má gradient z loga Aurory (#F5BAA8 → #F4A36C → #F6C45D),
     stejný jako hlavní tlačítka na webu.

     Sloupce se zalamují přes flex-wrap, bez media queries — na mobilu
     tlačítko spadne pod text.
     ─────────────────────────────────────────────────────────────────── -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;400&display=swap');

  .aurora-clenstvi {
    background: #FBE9DE;
    border-radius: 24px;
    padding: 36px 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: center;
    justify-content: space-between;
  }

  .aurora-clenstvi-cta {
    flex: 0 0 auto;
    display: inline-block;
    padding: 15px 34px;
    border-radius: 9999px;
    background-image: linear-gradient(135deg, #F5BAA8 0%, #F4A36C 50%, #F6C45D 100%);
    color: #8C5F47;
    font-family: 'Poppins', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .aurora-clenstvi-cta:hover {
    opacity: 0.9;
  }
</style>

<div class="px-6 md:px-16 py-8 md:py-12" style="background:#FCF4F1;">
  <div class="container mx-auto">
    <div class="aurora-clenstvi">

    <div style="flex:1 1 300px;min-width:0;">
      <p style="margin:0 0 10px;font-family:'Allura',cursive;font-size:40px;font-weight:400;line-height:1.1;color:#8C5F47;">
        Online členství
      </p>
      <p style="margin:0;font-family:'Poppins',system-ui,sans-serif;font-size:15px;font-weight:300;line-height:1.7;color:#A87860;">
        Dopřej si chvíli jen pro sebe, kdykoliv ti to vyjde.<br>
        Měsíčně, nebo na celý rok — bez závazku, zrušíš kdykoliv.
      </p>
    </div>

    <a class="aurora-clenstvi-cta" href="https://aurorayoga.uscreen.io/join">
      Vybrat členství
    </a>

    </div>
  </div>
</div>
